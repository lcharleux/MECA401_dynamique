name: Publier le cours sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Jupyter Book
        run: python -m pip install -r requirements.txt
      - name: Construire le site pour le sous-chemin du dépôt
        run: jupyter-book build --html --strict
      - name: Vérifier les images et les ressources du site
        run: python scripts/check_site.py --base-url "$BASE_URL"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
